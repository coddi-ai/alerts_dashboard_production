# Client -> enabled dashboard services (route/module identifiers).
#
# Seeded to preserve current behavior: every client sees every nav-level
# service except `predictive`, which stays limited to CDA and CAPSTONE
# (matching the previous `predictive_allowed_clients` default in
# config/settings.py). Unknown clients/services default to DENIED - see
# config/client_services.py::is_service_enabled.
clients:
  CDA:
    enabled_services:
      - overview-general
      - overview-data-freshness
      - monitoring-alerts
      - monitoring-telemetry
      - monitoring-oil
      - predictive
      - agents-campbell-ai
      - integration-validacion-avisos
      - integration-seguimiento-avisos
      - reporting-main

  EMIN:
    enabled_services:
      - overview-general
      - overview-data-freshness
      - monitoring-alerts
      - monitoring-telemetry
      - monitoring-oil
      - agents-campbell-ai
      - integration-validacion-avisos
      - integration-seguimiento-avisos
      - reporting-main

  ENEX:
    enabled_services:
      - overview-general
      - overview-data-freshness
      - monitoring-alerts
      - monitoring-telemetry
      - monitoring-oil
      - agents-campbell-ai
      - integration-validacion-avisos
      - integration-seguimiento-avisos
      - reporting-main

  CAPSTONE:
