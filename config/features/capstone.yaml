  - {name: egt_cyl_dev_11, derived: "egt_11_c - egt_avg_c", functional_group: egt}
  - {name: egt_cyl_dev_12, derived: "egt_12_c - egt_avg_c", functional_group: egt}
  - {name: egt_cyl_dev_13, derived: "egt_13_c - egt_avg_c", functional_group: egt}
